# 小耳朵英语 · 线上 HTTPS 配置（阿里云 ECS，Ubuntu 20.04）
# 根据 certbot 修改后的线上配置整理；证书及 TLS 参数仍由 certbot 管理。
# 证书就绪后由管理员手动启用，不能与 little-ears.http.conf 同时启用。
# little-ears.locations.conf 需放在 /etc/nginx/snippets/；日常部署只同步站点文件。

server {
    listen 80;
    # 服务器已开启 IPv6 时，再加一行：listen [::]:80;
    server_name loveran.com.cn www.loveran.com.cn;
    root /var/www/little-ears;
    server_tokens off;

    # 不在 server 级别 return，确保 HTTP-01 续期请求不被跳转覆盖。
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # 服务器已开启 IPv6 时，再加一行：listen [::]:443 ssl;
    server_name loveran.com.cn www.loveran.com.cn;

    ssl_certificate     /etc/letsencrypt/live/loveran.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loveran.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/little-ears;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/little-ears.access.log;
    error_log  /var/log/nginx/little-ears.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/little-ears.locations.conf;
}
