# 小耳朵英语 · HTTP 跳转 + HTTPS
# 证书放到 /etc/nginx/ssl/little-ears/ 之后再启用。没有证书文件时 nginx -t 会失败。
#
# 复制：
#   sudo mkdir -p /etc/nginx/snippets /etc/nginx/ssl/little-ears /var/www/little-ears
#   sudo cp deploy/nginx/little-ears.locations.conf /etc/nginx/snippets/little-ears.locations.conf
#   sudo cp deploy/nginx/little-ears.conf /etc/nginx/sites-available/little-ears.conf
#   sudo ln -sf /etc/nginx/sites-available/little-ears.conf /etc/nginx/sites-enabled/little-ears.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
# 把 example.com 换成你的域名。若镜像把站点放在 conf.d 而不是 sites-enabled，见 docs/DEPLOY_CN.md。

server {
    listen 80;
    # 服务器已开启 IPv6 时，再加一行：listen [::]:80;
    server_name example.com www.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/little-ears;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 22.04 / 24.04 自带的 Nginx 用这一行打开 HTTP/2。
    # Nginx 1.25.1 及以上若提示 listen 参数 http2 已弃用，改成两行：listen 443 ssl;  和  http2 on;
    listen 443 ssl http2;
    # 服务器已开启 IPv6 时，再加一行：listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/ssl/little-ears/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/little-ears/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/little-ears;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/little-ears.access.log;
    error_log  /var/log/nginx/little-ears.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    include /etc/nginx/snippets/little-ears.locations.conf;
}
