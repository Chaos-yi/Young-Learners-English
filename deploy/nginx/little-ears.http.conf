# 小耳朵英语 · 首次申请证书前的 HTTP 引导配置
# 线上已使用 certbot HTTPS，不需要切回此文件。
# 仅新建服务器、尚无证书时使用；证书就绪后改用 little-ears.conf，不要同时启用。
#
# 复制：
#   sudo mkdir -p /etc/nginx/snippets /var/www/little-ears
#   sudo cp deploy/nginx/little-ears.locations.conf /etc/nginx/snippets/little-ears.locations.conf
#   sudo cp deploy/nginx/little-ears.http.conf /etc/nginx/sites-available/little-ears.conf

server {
    listen 80;
    # 服务器已开启 IPv6 时，再加一行：listen [::]:80;
    server_name loveran.com.cn www.loveran.com.cn;

    root /var/www/little-ears;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/little-ears.access.log;
    error_log  /var/log/nginx/little-ears.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ^~ 优先于下面 snippets 里对「点开头路径」的拒绝，证书申请文件才能被访问。
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/little-ears.locations.conf;
}
