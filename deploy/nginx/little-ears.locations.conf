# 小耳朵英语 · 站点 location（由 little-ears.conf / little-ears.http.conf 引入）
# 复制到 /etc/nginx/snippets/little-ears.locations.conf
# 父级 server 必须已经设置 root。

# Service Worker 脚本每次都向服务器核对，否则平板会一直用旧缓存。
location = /sw.js {
    types { }
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

location ~* \.webmanifest$ {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

# 字体文件名不变，可以放久一点。改字体时把 sw.js 的 VERSION 加一。
location ~* \.woff2$ {
    types { }
    default_type font/woff2;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
    access_log off;
}

# css/js 没有带内容哈希的文件名，不能长缓存，否则 Service Worker 后台更新会拿到旧文件。
location ~* \.(?:css|js)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

location ~* \.(?:png|jpe?g|gif|webp|svg|ico)$ {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
    access_log off;
}

# 路由在 hash（#/videos 这类）里，服务器只看到 /。
# 未知路径回 index.html，方便直接打开首页；缺失的 css/js 仍返回 404。
location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
}

# 拒绝点开头的路径（例如误同步上去的 .git）。
# 证书校验目录由 server 里的 location ^~ /.well-known/acme-challenge/ 单独放行。
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
