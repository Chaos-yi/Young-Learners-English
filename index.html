<head>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23FFB21E'/%3E%3Cpath d='M14 27c-2-2-3-5-3-8a9 9 0 0 1 18 0c0 4-3 5-4 7s-1 5-4 5-3-2-3-2' fill='none' stroke='%231B2541' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/fonts/fonts.css">

</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/" aria-label="小耳朵英语 首页">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="12" fill="var(--sun)"/>
          <path d="M14 27c-2-2-3-5-3-8a9 9 0 0 1 18 0c0 4-3 5-4 7s-1 5-4 5-3-2-3-2" fill="none" stroke="#1B2541" stroke-width="3" stroke-linecap="round"/>
          <path d="M16.5 19a3.5 3.5 0 0 1 7 0" fill="none" stroke="#1B2541" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">小耳朵英语<small>Little Ears</small></span>
      </a>
      <div class="top-stats">
        <span class="chip chip-timer" id="timer" title="今天的学习时间"></span>
        <a class="chip chip-stars" id="stars" href="#/stickers" title="我的星星和贴纸"></a>
        <a class="icon-btn" href="#/parent" aria-label="家长中心" title="家长中心" id="parentLink"></a>
      </div>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="site-footer">
    <!--
      ICP / 公安备案号占位。上线前只改下面两处文字，ICP 的 href 保持不动：
      - 把「京ICP备XXXXXXXX号」换成真实编号，例如 京ICP备12345678号-1。
        href 必须保持 https://beian.miit.gov.cn/
      - 把「京公网安备XXXXXXXXXXXXX号」换成真实编号，例如 京公网安备11010502012345号。
        编号里的连续数字会自动接到 https://www.beian.gov.cn/ 的查询链接上。
      文字里还连续出现 X 时，链接先隐藏，避免备案审核时页面上出现假编号。
      步骤见 docs/DEPLOY_CN.md。
    -->
    <p class="beian-row">
      <a id="beian-icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备XXXXXXXX号</a>
      <a id="beian-mps" href="https://www.beian.gov.cn/" target="_blank" rel="noopener noreferrer">京公网安备XXXXXXXXXXXXX号</a>
    </p>
  </footer>
  <script>
  (function () {
    function ready(el) {
      if (!el) return false;
      var text = (el.textContent || "").replace(/\s+/g, "");
      if (!text || /X{4,}/.test(text)) {
        el.hidden = true;
        return false;
      }
      el.hidden = false;
      return true;
    }
    ready(document.getElementById("beian-icp"));
    var mps = document.getElementById("beian-mps");
    if (!ready(mps)) return;
    var digits = (mps.textContent || "").replace(/\D/g, "");
    if (digits.length >= 6) {
      mps.href = "https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=" + digits;
    }
  })();
  </script>

  <nav class="tabbar" aria-label="主导航">
    <div class="tabbar-in" id="tabs"></div>
  </nav>

  <div id="layer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/speech.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
