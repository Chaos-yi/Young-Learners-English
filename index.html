<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小耳朵英语 Little Ears</title>
  <meta name="description" content="给零基础一年级孩子的家庭英语：看动画、跟我说、磨耳朵，每天 15 分钟。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小耳朵英语">
  <meta name="theme-color" content="#EDF3FB">
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./assets/fonts/fonts.css?v=5">
  <link rel="stylesheet" href="./assets/css/style.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/" aria-label="小耳朵英语 首页">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="12" fill="var(--sun)"/>
          <path d="M14 27c-2-2-3-5-3-8a9 9 0 0 1 18 0c0 4-3 5-4 7s-1 5-4 5-3-2-3-2" fill="none" stroke="#1B2541" stroke-width="3" stroke-linecap="round"/>
          <path d="M16.5 19a3.5 3.5 0 0 1 7 0" fill="none" stroke="#1B2541" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">小耳朵英语<small>Little Ears</small></span>
      </a>
      <div class="top-stats">
        <button class="profile-trigger" id="profileSwitch" type="button" aria-haspopup="dialog" aria-controls="profileDialog" aria-label="切换孩子档案"></button>
        <span class="chip chip-timer" id="timer" title="今天的学习时间"></span>
        <a class="chip chip-stars" id="stars" href="#/stickers" title="我的星星和贴纸"></a>
        <a class="icon-btn" href="#/parent" aria-label="家长中心" title="家长中心" id="parentLink"></a>
      </div>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="site-footer">
    <!--
      ICP 备案已通过，链接保持 https://beian.miit.gov.cn/。
      公安备案审核中：「京公网安备XXXXXXXXXXXXX号」占位保持隐藏。
      号码下发后替换公安备案文字，编号里的数字会自动接到公安备案查询链接上。
      步骤见 docs/DEPLOY_CN.md。
    -->
    <p class="beian-row">
      <a id="beian-icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026035258号-2</a>
      <a id="beian-mps" href="https://www.beian.gov.cn/" target="_blank" rel="noopener noreferrer" hidden>京公网安备XXXXXXXXXXXXX号</a>
    </p>
  </footer>
  <script>
  (function () {
    function ready(el) {
      if (!el) return false;
      var text = (el.textContent || "").replace(/\s+/g, "");
      if (!text || /X{4,}/.test(text)) {
        el.hidden = true;
        return false;
      }
      el.hidden = false;
      return true;
    }
    var mps = document.getElementById("beian-mps");
    if (!ready(mps)) return;
    var digits = (mps.textContent || "").replace(/\D/g, "");
    if (digits.length >= 6) {
      mps.href = "https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=" + digits;
    }
  })();
  </script>

  <nav class="tabbar" aria-label="主导航">
    <div class="tabbar-in" id="tabs"></div>
  </nav>

  <div id="layer"></div>
  <dialog id="profileDialog" class="card profile-dialog m-parent" aria-labelledby="profileTitle"></dialog>

  <script src="./assets/js/data.js?v=5"></script>
  <script src="./assets/js/store.js?v=5"></script>
  <script src="./assets/js/speech.js?v=5"></script>
  <script src="./assets/js/app.js?v=5"></script>
</body>
</html>
